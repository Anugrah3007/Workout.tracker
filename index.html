<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dumbbell Workout Tracker</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#050705;color:#f4fff4;letter-spacing:.1px}
header{background:#050705;color:#b7ff00;padding:20px 18px 16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #1c2b00}
h1{font-size:22px;margin:0 0 7px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#b7ff00}
.sub{font-size:12px;opacity:.75;color:#d9ffd0}
main{max-width:720px;margin:auto;padding:14px}
.top-actions{margin-bottom:14px}
.days{display:flex;gap:7px;overflow-x:auto;margin-bottom:9px}
.day{background:#101410;color:#cfe6cf;white-space:nowrap;border:1px solid #283028;border-radius:9px;padding:10px 13px;font-weight:800}
.day.active{background:#b7ff00;color:#050705;border-color:#b7ff00}
.history-btn,.close{background:#101410;color:#b7ff00;border:1px solid #b7ff00;border-radius:9px;padding:10px 13px;font-weight:800;width:100%}
.card{background:#0b0f0b;border:1px solid #1e281e;border-radius:12px;padding:15px;margin:11px 0;box-shadow:0 0 0 1px rgba(183,255,0,.03)}
.exercise{font-size:17px;font-weight:900;color:#f4fff4}.target{font-size:12px;color:#8fa18f;margin:5px 0 12px;text-transform:uppercase}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) 82px 82px 28px;align-items:center;gap:7px;margin:7px 0;width:100%}
.set{flex:1;text-align:left;border:1px solid #283028;border-radius:8px;padding:11px;background:#151a15;color:#f4fff4;font-weight:800}
.set.done{background:#b7ff00;color:#050705;border-color:#b7ff00}.setrow .set{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.setrow input{min-width:0}
.reps{display:block;width:100%;height:40px;padding:8px 5px;background:#050705;color:#f4fff4;border:1px solid #394339;border-radius:8px;text-align:center;font-family:Arial,Helvetica,sans-serif}
.weight{display:block;width:100%;position:relative}.weight input{display:block;width:100%;height:40px;padding:8px 22px 8px 5px;background:#050705;color:#f4fff4;border:1px solid #394339;border-radius:8px;text-align:center;font-family:Arial,Helvetica,sans-serif}.weight:after{content:"kg";position:absolute;right:7px;top:12px;font-size:11px;color:#7f907f;pointer-events:none}
.set-actions{display:flex;gap:8px;margin:7px 0 4px}
.add-set{background:#151a15;color:#b7ff00;border:1px solid #b7ff00;border-radius:8px;padding:10px 13px;font-weight:800;flex:1}
.delete-set{background:#180b0b;color:#ff7b7b;border:1px solid #6e2929;border-radius:7px;width:28px;height:28px;padding:0;font-weight:900;font-size:16px;line-height:26px;text-align:center}
.timer{position:sticky;bottom:12px;background:#0b0f0b;color:#fff;border:1px solid #293329;border-radius:12px;padding:14px;margin-top:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 25px rgba(0,0,0,.55)}
.timer span{font-size:25px;font-weight:900;color:#b7ff00;font-variant-numeric:tabular-nums}.timer-control{background:#b7ff00;color:#050705;border:0;border-radius:8px;padding:9px 10px;font-weight:900;font-size:11px}.small{font-size:10px;opacity:.7;color:#a9b8a9;text-transform:uppercase;letter-spacing:1px}
.complete{background:#b7ff00;color:#050705;border:0;border-radius:9px;padding:14px;width:100%;font-weight:900;margin:8px 0 20px;text-transform:uppercase;letter-spacing:.4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}.modal-box{background:#090d09;color:#f4fff4;border:1px solid #334233;border-radius:14px;max-width:650px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.modal-box h2{margin-top:0;color:#b7ff00}.summary{background:#101510;border:1px solid #202b20;border-radius:9px;padding:12px;margin:9px 0}
.history-item{border-top:1px solid #263026;padding:12px 0}.modal-buttons{display:flex;gap:10px}.modal-buttons button{flex:1}
.yes{background:#b7ff00;color:#050705;border:0;border-radius:8px;padding:10px 14px;font-weight:900}
button{font-family:Arial,Helvetica,sans-serif;cursor:pointer}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#050705">
</head>
<body>
<header>
<h1>Dumbbell Workout Tracker</h1>
<div class="sub">TRAIN HARD. TRACK EVERY SET. REST 1 MINUTE.</div>
</header>

<main>
<div class="top-actions">
<div class="days" id="days"></div>
<button class="history-btn" onclick="showHistory()">Workout History</button>
</div>
<div id="workout"></div>

<div class="timer">
<div><div class="small">WORKOUT TIME</div><span id="time">00:00</span></div>
<div><div class="small">REST TIME</div><span id="restTime">00:00</span></div>
<div><button class="timer-control" id="workoutControl" onclick="toggleWorkoutTimer()">START WORKOUT</button></div>
</div>
</main>

<div class="modal" id="completionModal">
<div class="modal-box" id="completionContent"></div>
</div>

<div class="modal" id="historyModal">
<div class="modal-box">
<h2>Workout History</h2>
<div id="historyContent"></div>
<button class="close" onclick="closeHistory()">Close</button>
</div>
</div>

<div class="modal" id="earlyModal">
<div class="modal-box">
<h2>Finish Workout Early?</h2>
<p>You have not completed all of the sets.</p>
<p>Do you want to finish your workout early and save your progress?</p>
<div class="modal-buttons">
<button class="close" onclick="closeEarly()">No</button>
<button class="yes" onclick="confirmEarly()">Yes, Finish Early</button>
</div>
</div>
</div>

<script>
const plans={
Mon:{name:"Push - Chest, Shoulders and Triceps",items:[
["Dumbbell Bench Press",4,"8-12"],["Incline Dumbbell Press",3,"8-12"],["Dumbbell Shoulder Press",3,"8-12"],["Dumbbell Lateral Raise",3,"12-15"],["Overhead Dumbbell Triceps Extension",3,"10-15"],["Dumbbell Triceps Kickback",2,"12-15"]]},
Tue:{name:"Pull - Back and Biceps",items:[
["One-Arm Dumbbell Row",4,"8-12"],["Dumbbell Bent-Over Row",3,"8-12"],["Dumbbell Pullover",3,"10-12"],["Dumbbell Reverse Fly",3,"12-15"],["Dumbbell Biceps Curl",3,"10-12"],["Hammer Curl",2,"10-15"]]},
Wed:{name:"Legs",items:[
["Goblet Squat",4,"8-12"],["Dumbbell Romanian Deadlift",4,"8-12"],["Bulgarian Split Squat",3,"8-12 each leg"],["Dumbbell Lunges",3,"10 each leg"],["Standing Dumbbell Calf Raise",3,"15-20"]]},
Fri:{name:"Upper Body",items:[
["Dumbbell Bench Press",3,"8-12"],["One-Arm Dumbbell Row",3,"8-12"],["Incline Dumbbell Press",3,"10-12"],["Dumbbell Shoulder Press",3,"8-12"],["Dumbbell Lateral Raise",3,"12-15"],["Hammer Curl",2,"10-15"],["Overhead Dumbbell Triceps Extension",2,"10-15"]]},
Sat:{name:"Lower Body and Core",items:[
["Goblet Squat",4,"10-12"],["Dumbbell Romanian Deadlift",3,"8-12"],["Bulgarian Split Squat",3,"10 each leg"],["Dumbbell Glute Bridge",3,"12-15"],["Dumbbell Calf Raise",3,"15-20"],["Dumbbell Russian Twist",3,"12-20"]]}
};

const order=["Mon","Tue","Wed","Fri","Sat"];
const labels={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Fri:"Friday",Sat:"Saturday"};
let current="Mon";
let workoutStart=0;
let workoutElapsed=0;
let workoutRunning=false;
let workoutInterval=null;
let restInterval=null;
let restEnd=0;
let sessionFinished=false;

function setCountKey(i){return current+"-set-count-"+i}
function getSetCount(i){return parseInt(localStorage.getItem(setCountKey(i))||plans[current].items[i][1],10)}
function setKey(i,s){return current+"-set-"+i+"-"+s}
function repsKey(i,s){return setKey(i,s)+"-reps"}
function weightKey(i,s){return setKey(i,s)+"-weight"}

function render(){
document.getElementById("days").innerHTML=order.map(function(d){
return '<button class="day '+(d===current?'active':'')+'" onclick="selectDay(\''+d+'\')">'+labels[d]+'</button>';
}).join("");

const p=plans[current];
let output="<h2>"+p.name+"</h2>";

p.items.forEach(function(x,i){
let sets="";
for(let s=0;s<getSetCount(i);s++){
let done=localStorage.getItem(setKey(i,s));
let reps=localStorage.getItem(repsKey(i,s))||"";
let setWeight=localStorage.getItem(weightKey(i,s))||"";
sets+=
'<div class="setrow">'+
'<button class="set '+(done?'done':'')+'" onclick="toggleSet('+i+','+s+')">'+
("Set "+(s+1)+(done?" - Done":""))+
'</button>'+
'<input class="reps" type="number" min="0" max="100" inputmode="numeric" placeholder="Reps" aria-label="Repetitions for set '+(s+1)+'" value="'+reps+'" onchange="saveReps('+i+','+s+',this.value)">'+
'<label class="weight"><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" aria-label="Weight in kilograms for set '+(s+1)+'" value="'+setWeight+'" onchange="saveWeight('+i+','+s+',this.value)"></label>'+
(s>=plans[current].items[i][1] ? '<button class="delete-set" onclick="deleteSet('+i+','+s+')" aria-label="Delete added set">X</button>' : '')+
'</div>';
}
output+=
'<div class="card">'+
'<div class="exercise">'+(i+1)+". "+x[0]+"</div>"+
'<div class="target">'+getSetCount(i)+" sets - Target: "+x[2]+"</div>"+
sets+
'<div class="set-actions"><button class="add-set" onclick="addSet('+i+')">Add Set</button></div>'+
'</div>';
});

output+='<button class="complete" onclick="completeWorkout()">Complete Workout</button>';
document.getElementById("workout").innerHTML=output;
}

function toggleWorkoutTimer(){
if(sessionFinished) return;

if(workoutRunning){
pauseWorkoutTimer();
}else{
startWorkoutTimer();
}
}

function startWorkoutTimer(){
if(workoutRunning) return;
workoutStart=Date.now()-workoutElapsed*1000;
workoutRunning=true;
document.getElementById("workoutControl").textContent="PAUSE WORKOUT";

clearInterval(workoutInterval);
workoutInterval=setInterval(updateWorkoutTimer,250);
updateWorkoutTimer();
}

function pauseWorkoutTimer(){
if(!workoutRunning) return;
workoutElapsed=Math.floor((Date.now()-workoutStart)/1000);
workoutRunning=false;
clearInterval(workoutInterval);
workoutInterval=null;
document.getElementById("workoutControl").textContent="START WORKOUT";
updateWorkoutTimer();
}

function updateWorkoutTimer(){
if(workoutRunning){
workoutElapsed=Math.floor((Date.now()-workoutStart)/1000);
}
document.getElementById("time").textContent=formatDuration(workoutElapsed);
}

function selectDay(d){
current=d;
sessionFinished=false;
pauseWorkoutTimer();
workoutElapsed=0;
document.getElementById("time").textContent="00:00";
document.getElementById("restTime").textContent="00:00";
document.getElementById("workoutControl").textContent="START WORKOUT";
render();
}

function addSet(i){
localStorage.setItem(setCountKey(i),String(getSetCount(i)+1));
render();
}

function deleteSet(i,s){
const originalCount=plans[current].items[i][1];
const currentCount=getSetCount(i);

if(currentCount<=originalCount || s<originalCount){
alert("Only sets that you added can be deleted.");
return;
}

if(localStorage.getItem(setKey(i,s))){
alert("Undo the completed set first, then delete it.");
return;
}

for(let n=s;n<currentCount-1;n++){
const nextSet=setKey(i,n+1);
const thisSet=setKey(i,n);
const nextReps=repsKey(i,n+1);
const thisReps=repsKey(i,n);
const nextWeight=weightKey(i,n+1);
const thisWeight=weightKey(i,n);

if(localStorage.getItem(nextSet)){
localStorage.setItem(thisSet,"1");
}else{
localStorage.removeItem(thisSet);
}

const reps=localStorage.getItem(nextReps);
if(reps!==null){
localStorage.setItem(thisReps,reps);
}else{
localStorage.removeItem(thisReps);
}

const weight=localStorage.getItem(nextWeight);
if(weight!==null){
localStorage.setItem(thisWeight,weight);
}else{
localStorage.removeItem(thisWeight);
}
}

localStorage.removeItem(setKey(i,currentCount-1));
localStorage.removeItem(repsKey(i,currentCount-1));
localStorage.removeItem(weightKey(i,currentCount-1));
localStorage.setItem(setCountKey(i),String(currentCount-1));
render();
}

function saveReps(i,s,value){
localStorage.setItem(repsKey(i,s),value);
}

function saveWeight(i,s,value){
localStorage.setItem(weightKey(i,s),value);
}

function allSetsCompleted(){
for(let i=0;i<plans[current].items.length;i++){
for(let s=0;s<getSetCount(i);s++){
if(!localStorage.getItem(setKey(i,s))) return false;
}
}
return true;
}

function toggleSet(i,s){
const k=setKey(i,s);
if(localStorage.getItem(k)){
localStorage.removeItem(k);
render();
}else{
localStorage.setItem(k,"1");
render();
startRest();
setTimeout(function(){
if(allSetsCompleted()) finishWorkout();
},50);
}
}

function startRest(){
clearInterval(restInterval);
restEnd=Date.now()+60000;
updateRest();
restInterval=setInterval(updateRest,250);
}

function updateRest(){
const left=Math.max(0,restEnd-Date.now());
const seconds=Math.ceil(left/1000);
document.getElementById("restTime").textContent=
String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
if(left<=0){
clearInterval(restInterval);
document.getElementById("restTime").textContent="DONE";
}
}

function buildSummary(){
let totalSets=0,totalReps=0,rows="";

for(let i=0;i<plans[current].items.length;i++){
let ex=plans[current].items[i];
let exSets=getSetCount(i);
let setRows="";

for(let s=0;s<exSets;s++){
let r=parseInt(localStorage.getItem(repsKey(i,s))||"0",10);
if(!isNaN(r)) totalReps+=r;

let w=localStorage.getItem(weightKey(i,s))||"Not entered";
setRows+="Set "+(s+1)+": "+(localStorage.getItem(repsKey(i,s))||"0")+" reps - "+w+" kg<br>";
}

totalSets+=exSets;

rows+=
'<div class="summary"><strong>'+ex[0]+'</strong><br>'+
setRows+
'</div>';
}

return {rows:rows,totalSets:totalSets,totalReps:totalReps};
}

function formatDuration(s){
return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

function finishWorkout(){
if(sessionFinished) return;
sessionFinished=true;

const summary=buildSummary();
if(workoutRunning){
workoutElapsed=Math.floor((Date.now()-workoutStart)/1000);
}
const elapsed=workoutElapsed;
workoutRunning=false;
clearInterval(workoutInterval);
workoutInterval=null;
document.getElementById("workoutControl").textContent="START WORKOUT";

const record={
date:new Date().toLocaleString("en-GB"),
day:labels[current],
workout:plans[current].name,
duration:elapsed,
sets:summary.totalSets,
reps:summary.totalReps,
exercises:summary.rows
};

let history=JSON.parse(localStorage.getItem("workoutHistory")||"[]");
history.unshift(record);
localStorage.setItem("workoutHistory",JSON.stringify(history));

clearInterval(restInterval);
restInterval=null;
document.getElementById("restTime").textContent="00:00";

document.getElementById("completionContent").innerHTML=
"<h2>Congratulations!</h2>"+
"<p>You have completed today's workout.</p>"+
'<div class="summary"><strong>Workout:</strong> '+record.workout+'<br>'+
'<strong>Date and time:</strong> '+record.date+'<br>'+
'<strong>Workout time:</strong> '+formatDuration(record.duration)+'<br>'+
'<strong>Total sets:</strong> '+record.sets+'<br>'+
'<strong>Total repetitions:</strong> '+record.reps+"</div>"+
summary.rows+
'<button class="close" onclick="closeCompletionAndReset()">Start New Workout</button>';

document.getElementById("completionModal").classList.add("show");
}

function completeWorkout(){
if(allSetsCompleted()){
finishWorkout();
}else{
document.getElementById("earlyModal").classList.add("show");
}
}

function confirmEarly(){
closeEarly();
finishWorkout();
}

function closeEarly(){
document.getElementById("earlyModal").classList.remove("show");
}

function resetCurrentWorkout(){
const p=plans[current];

for(let i=0;i<p.items.length;i++){
for(let s=0;s<getSetCount(i);s++){
localStorage.removeItem(setKey(i,s));
localStorage.removeItem(repsKey(i,s));
localStorage.removeItem(weightKey(i,s));
}
localStorage.removeItem(setCountKey(i));
}

clearInterval(restInterval);
restInterval=null;
restEnd=0;
clearInterval(workoutInterval);
workoutInterval=null;
workoutRunning=false;
workoutElapsed=0;
document.getElementById("restTime").textContent="00:00";
document.getElementById("time").textContent="00:00";
document.getElementById("workoutControl").textContent="START WORKOUT";

sessionFinished=false;
render();
}

function closeCompletionAndReset(){
document.getElementById("completionModal").classList.remove("show");
resetCurrentWorkout();
}

function showHistory(){
let history=JSON.parse(localStorage.getItem("workoutHistory")||"[]");
let filtered=history.filter(function(r){return r.day===labels[current]});
let out="<p><strong>"+labels[current]+" workout history only</strong></p>";

if(!filtered.length){
out+="<p>No previous "+labels[current]+" workouts have been completed yet.</p>";
}else{
filtered.forEach(function(r){
out+='<div class="history-item"><strong>'+r.workout+"</strong><br>"+
r.date+"<br>Workout time: "+formatDuration(r.duration)+"<br>"+
"Total sets: "+r.sets+"<br>Total repetitions: "+r.reps+
"<div>"+r.exercises+"</div></div>";
});
}
document.getElementById("historyContent").innerHTML=out;
document.getElementById("historyModal").classList.add("show");
}

function closeHistory(){
document.getElementById("historyModal").classList.remove("show");
}

render();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("./service-worker.js"); }); }</script>
</body>
</html>
